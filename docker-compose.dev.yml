name: family-app-dev

x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile
  image: family-app-api:dev
  environment:
    NODE_ENV: development
    PORT: 3100
    DB_HOST: db
    DB_PORT: 5432
    DB_USER: family
    DB_PASSWORD: family123
    DB_NAME: family_app
    JWT_SECRET: family-app-local-web-demo-secret
    BOOTSTRAP_SECRET: family-app-local-bootstrap-secret
    SEED_ACCOUNT_PASSWORD: family1234
    JWT_EXPIRES_SECONDS: 900
    REFRESH_TOKEN_EXPIRES_SECONDS: 2592000
    LOGIN_RATE_LIMIT: 5
    LOGIN_RATE_WINDOW_MS: 60000
    MEDIA_PRIMARY_LIBRARY: ${MEDIA_PRIMARY_LIBRARY:-plex}
    PLEX_BASE_URL: ${PLEX_BASE_URL:-}
    PLEX_TOKEN: ${PLEX_TOKEN:-}
    PLEX_TOKEN_FILE: ${PLEX_TOKEN_FILE:-}
    PLEX_NAME: ${PLEX_NAME:-Plex}
    EMBY_BASE_URL: ${EMBY_BASE_URL:-}
    EMBY_API_KEY: ${EMBY_API_KEY:-}
    EMBY_API_KEY_FILE: ${EMBY_API_KEY_FILE:-}
    EMBY_NAME: ${EMBY_NAME:-Emby}
    MOVIEPILOT_BASE_URL: ${MOVIEPILOT_BASE_URL:-}
    MOVIEPILOT_API_KEY: ${MOVIEPILOT_API_KEY:-}
    MOVIEPILOT_API_KEY_FILE: ${MOVIEPILOT_API_KEY_FILE:-}
    MOVIEPILOT_NAME: ${MOVIEPILOT_NAME:-MoviePilot}
    MOVIEPILOT_RECONCILE_ENABLED: ${MOVIEPILOT_RECONCILE_ENABLED:-true}
    MOVIEPILOT_RECONCILE_INTERVAL_MS: ${MOVIEPILOT_RECONCILE_INTERVAL_MS:-60000}
    MOVIEPILOT_RECONCILE_INITIAL_DELAY_MS: ${MOVIEPILOT_RECONCILE_INITIAL_DELAY_MS:-10000}
    MOVIEPILOT_RECONCILE_FINAL_GRACE_MS: ${MOVIEPILOT_RECONCILE_FINAL_GRACE_MS:-21600000}
    TMDB_API_BASE_URL: ${TMDB_API_BASE_URL:-https://api.themoviedb.org/3}
    TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p/w500}
    TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
    TMDB_API_TOKEN_FILE: ${TMDB_API_TOKEN_FILE:-}
    TMDB_API_KEY: ${TMDB_API_KEY:-}
    TMDB_API_KEY_FILE: ${TMDB_API_KEY_FILE:-}
    DOUBAN_API_BASE_URL: ${DOUBAN_API_BASE_URL:-}
    DOUBAN_API_TOKEN: ${DOUBAN_API_TOKEN:-}
    DOUBAN_API_TOKEN_FILE: ${DOUBAN_API_TOKEN_FILE:-}
    BANGUMI_API_BASE_URL: ${BANGUMI_API_BASE_URL:-https://api.bgm.tv}
    BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
    BANGUMI_ACCESS_TOKEN_FILE: ${BANGUMI_ACCESS_TOKEN_FILE:-}
    BANGUMI_USER_AGENT: ${BANGUMI_USER_AGENT:-family-app/0.1 (self-hosted household media search)}
    INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-}
    INTEGRATION_SECRET_KEY_FILE: ${INTEGRATION_SECRET_KEY_FILE:-}
    OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    OPENWEATHER_API_KEY_FILE: ${OPENWEATHER_API_KEY_FILE:-}
    OPENWEATHER_BASE_URL: ${OPENWEATHER_BASE_URL:-https://api.openweathermap.org/data/2.5}
    BACKUP_SCHEDULER_POLL_INTERVAL_MS: ${BACKUP_SCHEDULER_POLL_INTERVAL_MS:-30000}
    BACKUP_RUN_STALE_MS: ${BACKUP_RUN_STALE_MS:-7200000}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family123
      POSTGRES_DB: family_app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - family_app_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    <<: *api-common
    command: ["pnpm", "--filter", "api", "seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-common
    init: true
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "3100:3100"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - family_app_uploads:/app/apps/api/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup-worker:
    build:
      context: .
      dockerfile: Dockerfile.backup-worker
    image: family-app-backup-worker:dev
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: family
      DB_PASSWORD: family123
      DB_NAME: family_app
      BACKUP_ROOT: /backups
      UPLOADS_DIR: /source/uploads
      RESTORE_WORK_ROOT: /restore-work
      BACKUP_WORKER_POLL_SECONDS: ${BACKUP_WORKER_POLL_SECONDS:-15}
      APP_GIT_COMMIT: ${APP_VERSION:-development}
    volumes:
      - family_app_uploads:/source/uploads:ro
      - ./backups-managed:/backups
    tmpfs:
      - /restore-work:size=2g,nosuid
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  family_app_pgdata_dev:
  family_app_uploads:
