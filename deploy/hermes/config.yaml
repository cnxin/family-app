platform_toolsets:
  api_server:
    - family_app

mcp_servers:
  family_app:
    url: http://api:3100/internal/agent/mcp
    headers:
      Authorization: Bearer ${AGENT_MCP_KEY}
    tools:
      include:
        - get_today_summary
        - get_calendar
        - get_tasks
        - get_shopping_list
        - get_meal_plan
        - get_inventory_alerts
        - search_knowledge
        - get_travel_checklist
        - get_watch_candidates
        - get_recent_memories
        - propose_task
        - propose_reminder
        - propose_poll
        - propose_menu
        - propose_shopping_items
      prompts: false
      resources: false

memory:
  enabled: false

worktree: false
