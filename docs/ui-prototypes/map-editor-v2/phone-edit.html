.screen{position:relative;overflow:hidden;background:#f4eee6}

.glass{background:rgba(255,253,249,.86);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(60,50,40,.12);box-shadow:0 6px 24px rgba(40,30,20,.12)}

.tb{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;color:#4a423a;white-space:nowrap}
.tb.on{background:#2f6b52;color:#fff}
.tb.dim{color:#b5aca2}

.note{position:absolute;font-size:12.5px;color:#7a6f64}
.chip{position:absolute;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;font-size:14px}
.float{position:absolute;display:flex;gap:2px;padding:4px;border-radius:12px}
.float .tb{height:34px;padding:0 10px;font-size:13px}
.pop{position:absolute;border-radius:12px;padding:6px;width:210px;font-size:13.5px}
.pop div{padding:9px 10px;border-radius:8px;display:flex;justify-content:space-between}
.pop div:first-child{background:#eef4f0}
.pop .k{color:#a39a8e;font-size:12px}
.pop hr{border:0;border-top:1px solid rgba(60,50,40,.1);margin:4px 6px}
.panel{position:absolute;border-radius:16px;padding:14px}
.panel h4{margin:6px 4px 8px;font-size:12px;color:#7a6f64;font-weight:600}
.grid{display:grid;gap:6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;font-size:12px;color:#4a423a;background:rgba(255,255,255,.6);border:1px solid rgba(60,50,40,.08)}
.cell svg{width:30px;height:30px;color:#5b534a}
.cell.decor svg{color:#a39a8e}
.tag{position:absolute;font-size:12px;background:#c0622d;color:#fff;border-radius:6px;padding:3px 7px}
.caption{font-size:13px;color:#5d544b;margin:10px 4px 0;line-height:1.6}
