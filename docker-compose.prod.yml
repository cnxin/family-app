name: family-app-prod

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-family_app}
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - db_password
    volumes:
      - family_app_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *container-logging
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-1.00}"
          memory: ${DB_MEMORY_LIMIT:-1G}

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: family-app-api:${APP_VERSION:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      PORT: 3100
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-family}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${POSTGRES_DB:-family_app}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-900}
      REFRESH_TOKEN_EXPIRES_SECONDS: ${REFRESH_TOKEN_EXPIRES_SECONDS:-2592000}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW_MS: ${LOGIN_RATE_WINDOW_MS:-60000}
      BOOTSTRAP_SECRET_FILE: /run/secrets/bootstrap_secret
      INTEGRATION_SECRET_KEY_FILE: /run/secrets/integration_secret
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      TZ: ${TZ:-Asia/Shanghai}
      MEDIA_PRIMARY_LIBRARY: ${MEDIA_PRIMARY_LIBRARY:-plex}
      PLEX_BASE_URL: ${PLEX_BASE_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_TOKEN_FILE: ${PLEX_TOKEN_FILE:-}
      PLEX_NAME: ${PLEX_NAME:-Plex}
      EMBY_BASE_URL: ${EMBY_BASE_URL:-}
      EMBY_API_KEY: ${EMBY_API_KEY:-}
      EMBY_API_KEY_FILE: ${EMBY_API_KEY_FILE:-}
      EMBY_NAME: ${EMBY_NAME:-Emby}
      MOVIEPILOT_BASE_URL: ${MOVIEPILOT_BASE_URL:-}
      MOVIEPILOT_API_KEY: ${MOVIEPILOT_API_KEY:-}
      MOVIEPILOT_API_KEY_FILE: ${MOVIEPILOT_API_KEY_FILE:-}
      MOVIEPILOT_NAME: ${MOVIEPILOT_NAME:-MoviePilot}
      MOVIEPILOT_RECONCILE_ENABLED: ${MOVIEPILOT_RECONCILE_ENABLED:-true}
      MOVIEPILOT_RECONCILE_INTERVAL_MS: ${MOVIEPILOT_RECONCILE_INTERVAL_MS:-60000}
      MOVIEPILOT_RECONCILE_INITIAL_DELAY_MS: ${MOVIEPILOT_RECONCILE_INITIAL_DELAY_MS:-10000}
      MOVIEPILOT_RECONCILE_FINAL_GRACE_MS: ${MOVIEPILOT_RECONCILE_FINAL_GRACE_MS:-21600000}
      TMDB_API_BASE_URL: ${TMDB_API_BASE_URL:-https://api.themoviedb.org/3}
      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p/w500}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      TMDB_API_TOKEN_FILE: ${TMDB_API_TOKEN_FILE:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_API_KEY_FILE: ${TMDB_API_KEY_FILE:-}
      DOUBAN_API_BASE_URL: ${DOUBAN_API_BASE_URL:-}
      DOUBAN_API_TOKEN: ${DOUBAN_API_TOKEN:-}
      DOUBAN_API_TOKEN_FILE: ${DOUBAN_API_TOKEN_FILE:-}
      BANGUMI_API_BASE_URL: ${BANGUMI_API_BASE_URL:-https://api.bgm.tv}
      BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
      BANGUMI_ACCESS_TOKEN_FILE: ${BANGUMI_ACCESS_TOKEN_FILE:-}
      BANGUMI_USER_AGENT: ${BANGUMI_USER_AGENT:-family-app/0.1 (self-hosted household media search)}
      BACKUP_SCHEDULER_POLL_INTERVAL_MS: ${BACKUP_SCHEDULER_POLL_INTERVAL_MS:-30000}
      BACKUP_RUN_STALE_MS: ${BACKUP_RUN_STALE_MS:-7200000}
    secrets:
      - db_password
      - jwt_secret
      - bootstrap_secret
      - integration_secret
    volumes:
      - family_app_uploads_prod:/app/apps/api/uploads
      - ./deploy/secrets:/run/integration-secrets:ro
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *container-logging
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - integrations
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.00}"
          memory: ${API_MEMORY_LIMIT:-512M}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: /api
    image: family-app-web:${APP_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS must be set}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - family_app_caddy_data_prod:/data
      - family_app_caddy_config_prod:/config
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2015/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *container-logging
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT:-0.50}"
          memory: ${WEB_MEMORY_LIMIT:-256M}

  backup-worker:
    build:
      context: .
      dockerfile: Dockerfile.backup-worker
    image: family-app-backup-worker:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-family}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${POSTGRES_DB:-family_app}
      BACKUP_ROOT: /backups
      UPLOADS_DIR: /source/uploads
      RESTORE_WORK_ROOT: /restore-work
      BACKUP_WORKER_POLL_SECONDS: ${BACKUP_WORKER_POLL_SECONDS:-15}
      APP_GIT_COMMIT: ${APP_VERSION:-latest}
    secrets:
      - db_password
    volumes:
      - family_app_uploads_prod:/source/uploads:ro
      - ${FAMILY_APP_BACKUP_ROOT:-./backups-production-managed}:/backups
    tmpfs:
      - /restore-work:size=${BACKUP_RESTORE_WORK_SIZE:-2g},nosuid
    depends_on:
      api:
        condition: service_healthy
    logging: *container-logging
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${BACKUP_CPU_LIMIT:-1.00}"
          memory: ${BACKUP_MEMORY_LIMIT:-1G}

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_PATH:-./deploy/secrets/db_password.txt}
  jwt_secret:
    file: ${JWT_SECRET_PATH:-./deploy/secrets/jwt_secret.txt}
  bootstrap_secret:
    file: ${BOOTSTRAP_SECRET_PATH:-./deploy/secrets/bootstrap_secret.txt}
  integration_secret:
    file: ${INTEGRATION_SECRET_PATH:-./deploy/secrets/integration_secret.txt}

volumes:
  family_app_pgdata_prod:
  family_app_uploads_prod:
  family_app_caddy_data_prod:
  family_app_caddy_config_prod:

networks:
  frontend:
  backend:
    internal: true
  integrations:
